name: Launch OCI ARM instance

on:
   workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  actions: write              # so the workflow can disable itself after success
  contents: read
  issues: write               # so the workflow can open a "launched" issue (emails you)

concurrency:
  group: oci-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh -o install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults --install-dir "$HOME/lib/oracle-cli" --exec-dir "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Write OCI config
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY_PEM }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_API_KEY" > ~/.oci/api_key.pem
          chmod 600 ~/.oci/api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          fingerprint=$OCI_FINGERPRINT
          region=$OCI_REGION
          key_file=~/.oci/api_key.pem
          EOF
          chmod 600 ~/.oci/config

      - name: Attempt launch
        id: attempt
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          DISPLAY_NAME: arm-stremio
          OCPUS: 4
          MEMORY_GB: 24
          BOOT_VOLUME_GB: 200
        run: bash launch.sh

      - name: Notify by opening a GitHub issue
        if: steps.attempt.outputs.launched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AD: ${{ steps.attempt.outputs.ad }}
          INSTANCE_ID: ${{ steps.attempt.outputs.instance_id }}
          PUBLIC_IP: ${{ steps.attempt.outputs.public_ip }}
        run: |
          gh issue create \
            --title "OCI ARM instance launched 🎉" \
            --body "$(cat <<EOF
          Your Always-Free Ampere A1 instance is now running.

          - **Availability domain**: \`${AD:-unknown}\`
          - **Instance OCID**: \`${INSTANCE_ID:-see OCI Console}\`
          - **Public IP**: \`${PUBLIC_IP:-see OCI Console}\`

          Next steps:
          1. SSH in: \`ssh -i ~/.ssh/<your-key> ubuntu@${PUBLIC_IP:-<public-ip>}\`
          2. Install Docker and run your Stremio server.
          3. Open ports 11470/12470 in the VCN's Security List for Stremio access.

          The launcher workflow has been auto-disabled. You can re-enable it if you ever want to provision again.
          EOF
          )"

      - name: Disable workflow on success
        if: steps.attempt.outputs.launched == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow disable launch.yml
